# Nexora cloud scanner: the desk scanner (FILTER_VER 2026-10-27a, unchanged) on GitHub-hosted runners,
# Mon-Fri 08:00-23:00 Europe/Rome, so scanner alerts reach the desk webhook while the desk box is asleep.
# Public market data only. No Kraken keys, no orders. Public repo = unlimited standard-runner minutes.
#
# 3 long blocks per weekday (Rome): 08:00-13:00, 13:00-18:00, 18:00-23:00. Each job loops on the same
# 5-minute wall-clock slots as the box (+20 s) and exits at the end of its block (cloud/cloud_loop.py computes the
# end from the ACTUAL start time in Europe/Rome, so late starts and CET/CEST are handled).
# Each block has a primary start 5 minutes early plus 2 catch-ups, because GitHub can delay or drop schedule events.
# The concurrency group keeps exactly one job running; a start that arrives while a block runs waits (newer
# waiting starts replace older ones), then covers the next block or exits at once after 23:00.
name: Cloud scanner

on:
  schedule:
    # Block 1 08:00-13:00 Rome
    - cron: "55 7 * * 1-5"
      timezone: "Europe/Rome"
    - cron: "20 8 * * 1-5"
      timezone: "Europe/Rome"
    - cron: "5 9 * * 1-5"
      timezone: "Europe/Rome"
    # Block 2 13:00-18:00 Rome
    - cron: "55 12 * * 1-5"
      timezone: "Europe/Rome"
    - cron: "20 13 * * 1-5"
      timezone: "Europe/Rome"
    - cron: "5 14 * * 1-5"
      timezone: "Europe/Rome"
    # Block 3 18:00-23:00 Rome
    - cron: "55 17 * * 1-5"
      timezone: "Europe/Rome"
    - cron: "20 18 * * 1-5"
      timezone: "Europe/Rome"
    - cron: "5 19 * * 1-5"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = scan but never POST to the webhook"
        required: false
        default: "0"
      max_scans:
        description: "Stop after N scans (empty = until the end of the block)"
        required: false
        default: ""

concurrency:
  group: nexora-cloud-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Rome
      PYTHONUNBUFFERED: "1"
      CLOUD_MAX_MINUTES: "340"
      CLOUD_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      CLOUD_MAX_SCANS: ${{ github.event.inputs.max_scans }}
      DESK_ENTRIES_SUSPENDED: ${{ vars.DESK_ENTRIES_SUSPENDED }}
      DESK_EQUITY: ${{ vars.DESK_EQUITY }}
    steps:
      - name: Record job start
        run: echo "CLOUD_JOB_START_UNIX=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Market-data state only (candles, OI/funding history, alert ledgers). Never uploaded as an artifact.
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            desk/cache
            desk/state
          key: cloud-scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cloud-scanner-state-

      - name: Self-test (filters unchanged, cloud wrapper)
        run: python -B tests/run_all.py

      - name: Scan until the end of the block
        env:
          DESK_HEAD_WEBHOOK_URL: ${{ secrets.DESK_HEAD_WEBHOOK_URL }}
          DESK_HEAD_WEBHOOK_KEY: ${{ secrets.DESK_HEAD_WEBHOOK_KEY }}
        run: python -B cloud/cloud_loop.py

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            desk/cache
            desk/state
          key: cloud-scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
